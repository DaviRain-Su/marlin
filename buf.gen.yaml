# Generates Go bindings for the vendored marlin.app.v1 schema.
# Run via scripts/gen-stubs.sh (it sets up PATH for the local plugins).
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
      # The vendored proto is Rust-owned and carries no go_package; inject the
      # import path here instead of editing the pinned source.
      - Mmarlin/app/v1/app_server.proto=marlin-desktop/gen/marlin/app/v1;appv1
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      - Mmarlin/app/v1/app_server.proto=marlin-desktop/gen/marlin/app/v1;appv1
