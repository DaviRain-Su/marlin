<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marlin</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="pristine">
    <div id="app">
      <aside id="sidebar">
        <button id="new-chat" type="button" class="new-chat">＋ 新对话</button>
        <button id="project-open" type="button" class="side-btn">打开项目…</button>
        <div class="side-card">
          <div class="status-line">
            <span id="status-dot" class="dot" data-state="starting"></span>
            <span id="status-text">连接中…</span>
          </div>
          <button id="chip-provider" type="button" class="chip" title="点击修改模型设置">—</button>
          <button id="chip-tools" type="button" class="chip" title="点击修改工具设置">—</button>
        </div>
        <div class="recents">
          <div class="recents-head">最近</div>
          <div id="session-list"></div>
        </div>
        <div class="side-bottom">
          <button id="settings-toggle" type="button" class="side-btn">⚙&nbsp;设置</button>
          <div class="side-note">历史持久化于本机 journal</div>
        </div>
      </aside>
      <main>
        <div id="topbar">
          <button id="side-toggle" type="button" title="收起/展开侧栏">☰</button>
          <div id="session-title" class="session-title" title="点击重命名当前会话">新对话</div>
          <span class="spacer"></span>
          <button id="project-review" type="button" class="chip" title="查看项目文件与 Git 变更">项目与变更</button>
        </div>
        <div id="banner" class="banner hidden"></div>
        <div id="unresolved-bar" class="unresolved-bar hidden">
          <span id="unresolved-text">上次回复已中断，远端结果未知。可以继续发送，已知历史会带入续接会话。</span>
          <button id="unresolved-new" type="button" class="primary">携带历史继续</button>
        </div>
        <div id="thread">
          <div id="messages" aria-live="polite"></div>
        </div>
        <div id="empty">
          <div class="greet-mark">✳</div>
          <h2 id="greeting">你好</h2>
          <div class="ideas">
            <div class="ideas-head">试试这些</div>
            <button type="button" class="idea" data-text="用一句话介绍你自己">
              <span class="idea-icon">✳</span>用一句话介绍你自己
            </button>
            <button type="button" class="idea" data-text="用 ls 看看工具目录里有什么，然后总结">
              <span class="idea-icon">📁</span>看看工具目录里有什么
            </button>
            <button type="button" class="idea" data-text="写一个 Go 语言的并发安全计数器，附简要说明">
              <span class="idea-icon">⌨️</span>写一段并发安全的 Go 代码
            </button>
          </div>
        </div>
        <div id="composer-wrap">
          <form id="composer">
            <div class="composer-card">
              <div id="queue-note" class="queue-note hidden"></div>
              <div id="queue-actions" class="hidden">
                <button id="queue-resume" type="button">继续发送队列</button>
                <button id="queue-clear" type="button">清空队列</button>
              </div>
              <textarea id="draft" rows="1" placeholder="给 Marlin 发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
              <div class="composer-actions">
                <button type="button" id="composer-chip" class="chip">—</button>
                <span class="spacer"></span>
                <button id="stop" type="button" class="stop-btn hidden" title="停止生成">■</button>
                <button id="send" type="submit" title="发送">↑</button>
              </div>
            </div>
          </form>
          <div class="disclaimer">Marlin 可能会犯错，请核查重要信息。</div>
        </div>
      </main>
    </div>
    <div id="project-overlay" class="overlay hidden">
      <section id="project-panel" class="settings" role="dialog" aria-modal="true" aria-labelledby="project-title">
        <div class="settings-head">
          <h3 id="project-title">项目与变更</h3>
          <span class="spacer"></span>
          <button id="project-refresh" type="button">刷新变更</button>
          <button id="project-choose" type="button">打开项目…</button>
          <button id="project-close" type="button" title="关闭项目面板">关闭</button>
        </div>
        <p id="project-root" class="hint"></p>
        <p class="hint">所有会话共享当前项目。Agent 可执行本机命令；项目目录不是沙箱。</p>
        <p id="project-summary" class="hint"></p>
        <div class="project-content">
          <nav id="project-files" aria-label="项目文件"></nav>
          <div class="project-preview">
            <button id="project-diff" type="button">查看 Git diff（含暂存区，不含未跟踪文件）</button>
            <div id="project-preview-title" class="hint">文件预览</div>
            <pre id="project-preview-text" tabindex="0"></pre>
          </div>
        </div>
      </section>
    </div>
    <div id="settings-overlay" class="overlay hidden">
      <div id="settings" class="settings" role="dialog" aria-modal="true">
        <div class="settings-head">
          <h3>设置</h3>
          <button id="settings-close" type="button" class="side-btn" title="关闭">✕</button>
        </div>
        <div class="settings-row">
          <label>Provider
            <select id="set-provider">
              <option value="kimi">kimi（Anthropic 协议）</option>
              <option value="deepseek">deepseek（OpenAI 协议）</option>
            </select>
          </label>
          <label>Model
            <input id="set-model" placeholder="k3 / deepseek-chat，留空用默认" autocomplete="off" />
          </label>
        </div>
        <div class="settings-row">
          <label>API Key
            <input id="set-key" type="password" placeholder="" autocomplete="new-password" />
          </label>
          <label>Base URL
            <input id="set-base-url" placeholder="留空用 provider 默认端点" autocomplete="off" />
          </label>
        </div>
        <div class="settings-row">
          <label>工具目录（留空禁用工具）
            <input id="set-tools-workspace" placeholder="/path/to/workspace" autocomplete="off" />
          </label>
          <label>工具白名单
            <input id="set-tools-allow" placeholder="* = 全部" autocomplete="off" />
          </label>
        </div>
        <div class="settings-actions">
          <span id="settings-hint" class="hint"></span>
          <span class="spacer"></span>
          <button id="settings-save" type="button">保存</button>
          <button id="settings-apply" type="button" class="primary">保存并重启 host</button>
        </div>
        <div id="settings-path" class="hint"></div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
